name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and Stage APK
        run: |
          mkdir -p apk-output
          find app/build/outputs/ -type f -name "*.apk" -exec cp {} apk-output/ \;
          echo "=== Generated APKs ==="
          ls -lh apk-output/
          if [ -z "$(ls -A apk-output/*.apk 2>/dev/null)" ]; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0-latest
          name: "Uconnect Audio Hub APK (Latest)"
          body: |
            ### Automated Build: Uconnect Audio Hub APK
            Android debug build generated by GitHub Actions.
          files: apk-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
