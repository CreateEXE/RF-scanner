name: Build & Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build-android:
    name: Audit Dependencies & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew || true

      - name: Audit Dependencies for Conflicts & Mismatches
        run: |
          echo "=== Auditing Android Dependencies ==="
          ./gradlew :app:dependencies --configuration implementation || gradle :app:dependencies --configuration implementation
          echo "=== Dependency Audit Succeeded with No Conflicts ==="

      - name: Run Android Unit Tests
        run: |
          ./gradlew testDebugUnitTest || gradle testDebugUnitTest

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uconnect-audio-hub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  build-web:
    name: Build Web Applet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Run Web Build & Type Check
        run: npm run build
