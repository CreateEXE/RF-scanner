name: Build & Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-build-android:
    name: Audit Dependencies & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          echo "=== Building Debug APK with Gradle ==="
          gradle :app:assembleDebug --stacktrace --no-daemon
          echo "=== Build Complete. Finding APK files ==="
          find app/build/outputs/ -name "*.apk" -ls

      - name: Prepare APK Output
        run: |
          mkdir -p release-apks
          APK_FILE=$(find app/build/outputs/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release-apks/uconnect-audio-hub-debug.apk
          else
            echo "ERROR: No APK found in app/build/outputs/"
            exit 1
          fi
          ls -lh release-apks/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uconnect-audio-hub-debug-apk
          path: release-apks/uconnect-audio-hub-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release with Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "Uconnect Audio Hub APK (Latest Build)"
          body: |
            ### Automated Build: Uconnect Audio Hub & 2-Channel RF/IR Diagnostic
            Direct download link for Android:
            * **[Download uconnect-audio-hub-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-latest/uconnect-audio-hub-debug.apk)**
          files: release-apks/uconnect-audio-hub-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build Web Applet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Web Build & Type Check
        run: npm run build
